[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-world-mcp"
version = "0.1.0"
description = "A lightweight text-world playground for autonomous AI agents and digital companions."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
  "mcp>=2.3,<3",
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.setuptools]
py-modules = ["app", "conversation", "storage", "llm", "prompts", "api_player", "mcp_server", "export_records", "stdio_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Use .*:DeprecationWarning"]
